{% extends 'base.html' %}

{% block content %}
  <div class="text-center mt-10">
    <h1 class="text-4xl font-bold text-blue-600 mb-4">Welcome to the To-Do App</h1>
    <p class="text-lg text-gray-600">Organize your tasks, track your progress, and stay productive.</p>
    {% if user.is_authenticated %}
      <a href="{% url 'task_list' %}" class="mt-6 inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Go to Tasks</a>
    {% else %}
      <a href="{% url 'login' %}" class="mt-6 inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Login to Start</a>
    {% endif %}
  </div>
{% endblock %}

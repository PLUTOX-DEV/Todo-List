{% extends "base.html" %}
{% block title %}Login - To Do App{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-xl rounded-xl p-8 max-w-md w-full">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>

        <!-- Django Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="px-4 py-3 mb-4 rounded-lg 
                    {% if message.tags == 'error' %}
                        bg-red-100 border border-red-400 text-red-700
                    {% elif message.tags == 'success' %}
                        bg-green-100 border border-green-400 text-green-700
                    {% endif %}">
                    <p class="text-sm">{{ message }}</p>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-gray-700 font-semibold">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required 
                    aria-label="Username" 
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-gray-700 font-semibold">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password" required 
                    aria-label="Password" 
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
                Login
            </button>
        </form>

        <!-- Link to Register -->
        <p class="mt-5 text-center text-gray-600">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline font-medium">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
